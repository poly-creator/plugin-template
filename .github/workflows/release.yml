# Release pipeline — `git tag v0.1.0 && git push origin v0.1.0` builds main.js,
# packs the plugin, and publishes a FULL GitHub Release with the three assets the
# registry's latest-mode convention requires:
#
#   <id>-<version>.zip   versioned install zip (pinned-mode installs)
#   <id>.zip             byte-identical alias — `releases/latest/download/<id>.zip`
#                        always resolves to the newest full release
#   manifest.json        alias of the integrity-injected manifest from inside the
#                        zip — the desktop's version probe
#
# The release MUST be full (not draft, not prerelease): `releases/latest` ignores
# drafts/prereleases, so the alias URLs would 404. This workflow publishes with
# `gh release create` (a full release by default); never edit it back to a draft.
#
# Registry entries in latest mode do NOT need the sha256 — in-zip integrity plus
# PR review carry the trust. Pin the printed sha256 only if you want a byte-locked
# pinned entry.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestation (where the artifact came from).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # A tag that disagrees with manifest.json would publish a version nobody
      # can address, and a release cannot be republished.
      - name: Guard tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p 'require("./manifest.json").version')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag != manifest.json version $version"
            exit 1
          fi

      - name: Build main.js
        run: npm run build

      - name: Pack release zips (versioned + aliases)
        # Invoke the script directly: `npm run` prints its own banner to stdout,
        # which would corrupt this JSON.
        run: node scripts/pack.mjs > /tmp/pack-summary.json

      - name: Read pack summary (zip paths, integrity, sha256)
        id: pack
        run: |
          for key in zip aliasZip aliasManifest sha256 integrity; do
            value=$(node -e "console.log(require('/tmp/pack-summary.json').$key)")
            {
              echo "${key}=$value"
            } >> "$GITHUB_OUTPUT"
          done
          cat /tmp/pack-summary.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.zip

      - name: Create GitHub Release (full, latest) with all three assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built from ${GITHUB_SHA}.

          versioned zip: \`${{ steps.pack.outputs.zip }}\`
          alias zip: \`${{ steps.pack.outputs.aliasZip }}\`
          alias manifest: \`${{ steps.pack.outputs.aliasManifest }}\`
          entry integrity: \`${{ steps.pack.outputs.integrity }}\`
          sha256: \`${{ steps.pack.outputs.sha256 }}\`

          Latest-mode registry entries need no pin. Pin the sha256 above only
          for a byte-locked pinned entry." \
            "release/${{ steps.pack.outputs.zip }}" \
            "release/${{ steps.pack.outputs.aliasZip }}" \
            "release/${{ steps.pack.outputs.aliasManifest }}"
