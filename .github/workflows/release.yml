# Build + pack + release your plugin on every `v*` tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces:
#   - dist/<id>-<version>.zip (the release asset, pinned by the registry)
#   - sha256 + integrity printed to the workflow log — copy sha256 into your
#     registry PR's entry.
#   - A GitHub Release with the zip attached + build provenance attestation.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Pack the plugin dir into the release zip. The workflow log prints the
      # sha256 to paste into the registry entry — CI there re-verifies it.
      - name: Pack plugin
        id: pack
        run: |
          SUMMARY=$(npx openclime-plugin-pack . --out dist)
          echo "$SUMMARY"
          SHA=$(echo "$SUMMARY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).sha256))")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: gh release create "$TAG" dist/*.zip --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip"

      - name: Print registry entry
        run: |
          echo "Paste this into openclime/plugins plugins.json:"
          echo "  {"
          echo "    \"id\": \"$(node -e "console.log(require('./manifest.json').id)")\","
          echo "    \"repo\": \"${{ github.repository }}\","
          echo "    \"tag\": \"${{ github.ref_name }}\","
          echo "    \"asset\": \"$(basename dist/*.zip)\","
          echo "    \"sha256\": \"${{ steps.pack.outputs.sha256 }}\","
          echo "    \"description\": \"$(node -e "console.log(require('./manifest.json').description||'')")\","
          echo "    \"categories\": $(node -e "console.log(JSON.stringify(require('./manifest.json').categories||[]))"),"
          echo "    \"added_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
          echo "  }"